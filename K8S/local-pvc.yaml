
# Local PersistentVolumeClaim for MSSQL database storage
# This PVC is used to persist SQL Server data in Kubernetes

# Secret Creation Command:
# kubectl create secret generic mssql --from-literal=SA_PASSWORD="<Str0ng!Passw0rd>"
# This creates a secret to store MSSQL SA password for pod environment variables

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-claim  # Name of the claim referenced by MSSQL pod
spec:
  accessModes:
    - ReadWriteOnce  # Single node read-write access
  resources:
    requests:
      storage: 200Mi  # Storage capacity allocation for database